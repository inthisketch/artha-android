name: Build Artha Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
        
      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q ArthaAndroid_CloudBuild.zip -d project

          echo "Project contents:"
          find project -maxdepth 5 -type f | head -100

          APP_MAIN=$(find project -type d -path "*/app/src/main" | head -1)

          if [ -z "$APP_MAIN" ]; then
            echo "ERROR: Android app directory not found"
            exit 1
          fi

          echo "Android app directory: $APP_MAIN"

          mkdir -p "$APP_MAIN/assets"

          cp index.html "$APP_MAIN/assets/index.html"
          
          echo "Installing updated MainActivity.java"

          MAIN_JAVA=$(find "$APP_MAIN/java" -type f -name "MainActivity.java" | head -1)

           if [ -z "$MAIN_JAVA" ]; then
            echo "ERROR: MainActivity.java not found"
              exit 1
          fi

           echo "Existing MainActivity:"
           echo "$MAIN_JAVA"

          BRIDGE_MAIN_JAVA="app/src/main/java/com/artha/personalfinance/MainActivity.java"

          if [ ! -f "$BRIDGE_MAIN_JAVA" ]; then
            echo "ERROR: Updated MainActivity.java was not found at $BRIDGE_MAIN_JAVA"
            exit 1
          fi

          cp "$BRIDGE_MAIN_JAVA" "$MAIN_JAVA"

          echo "Updated MainActivity:"
          wc -l "$MAIN_JAVA"

          grep -q "ArthaAndroidBridge" "$MAIN_JAVA" \
          && echo "EXPORT BRIDGE FOUND" \
          || echo "WARNING: Export bridge not found"

          echo "Copied latest root index.html into Android assets:"
          wc -l "$APP_MAIN/assets/index.html"

          echo "Checking for Artha 3.1 features:"
          grep -q "Import Transactions" "$APP_MAIN/assets/index.html" \
            && echo "IMPORT FEATURE FOUND" \
            || echo "WARNING: Import feature not found"

          grep -q "Export Transactions" "$APP_MAIN/assets/index.html" \
            && echo "EXPORT FEATURE FOUND" \
            || echo "WARNING: Export feature not found"

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artha-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
