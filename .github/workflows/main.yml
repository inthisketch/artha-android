name: Build Artha Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
  run: |
    mkdir -p project
    unzip -q ArthaAndroid_CloudBuild.zip -d project

    echo "Project contents:"
    find project -maxdepth 5 -type f | head -100

    APP_MAIN=$(find project -type d -path "*/app/src/main" | head -1)

    if [ -z "$APP_MAIN" ]; then
      echo "ERROR: Android app directory not found"
      exit 1
    fi

    echo "Android app directory: $APP_MAIN"

    mkdir -p "$APP_MAIN/assets"

    cp index.html "$APP_MAIN/assets/index.html"

    echo "Copied latest root index.html into Android assets:"
    wc -l "$APP_MAIN/assets/index.html"

          echo "Project contents:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artha-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
